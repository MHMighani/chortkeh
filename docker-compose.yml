version: "3.8"

services:
  frontend:
    build: ./client
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev  
    environment:
      - NODE_ENV=development            
         
  backend:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run start:dev
    environment:
      - NODE_ENV=development
    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db   

volumes:
  postgres-data:
